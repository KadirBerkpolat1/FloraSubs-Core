name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download Linux FFmpeg
        run: bash scripts/download-ffmpeg.sh
      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles deb,appimage

      - name: Package Linux release
        if: success()
        run: |
          cd src-tauri/target/release/bundle
          # Create tar.gz for Linux
          if [ -d "deb" ]; then
            find deb -name "*.deb" -exec cp {} FloraSubs-Reborn-${{ github.ref_name }}-linux-x86_64.deb \;
          fi
          if [ -d "appimage" ]; then
            find appimage -name "*.AppImage" -exec cp {} FloraSubs-Reborn-${{ github.ref_name }}-linux-x86_64.AppImage \;
          fi
          # Create a combined tarball with binaries
          mkdir -p release-package
          cp ../florasubs-core release-package/
          cp -r ../../../bin release-package/bin
          tar -czf FloraSubs-Reborn-${{ github.ref_name }}-linux-x86_64.tar.gz -C release-package .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            src-tauri/target/release/bundle/FloraSubs-Reborn-*-linux-x86_64.deb
            src-tauri/target/release/bundle/FloraSubs-Reborn-*-linux-x86_64.AppImage
            src-tauri/target/release/bundle/FloraSubs-Reborn-*-linux-x86_64.tar.gz
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: bun install

      - name: Download Windows FFmpeg
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/bin"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build.zip"
          $zip = "ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "ffmpeg-extract" -Force
          Copy-Item "ffmpeg-extract/*/bin/ffmpeg.exe" "src-tauri/bin/ffmpeg.exe" -Force
          Copy-Item "ffmpeg-extract/*/bin/ffprobe.exe" "src-tauri/bin/ffprobe.exe" -Force
          Remove-Item $zip, "ffmpeg-extract" -Recurse -Force

      - name: Build frontend
        run: bun run build

      - name: Build Tauri application (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis

      - name: Package Windows release
        if: success()
        run: |
          cd src-tauri/target/release/bundle
          if (Test-Path "nsis") {
            Get-ChildItem "nsis" -Filter "*.exe" | ForEach-Object {
              Copy-Item $_.FullName "FloraSubs-Reborn-${{ github.ref_name }}-windows-x64-Setup.exe"
            }
            # Also create portable zip
            if (Test-Path "FloraSubs-Reborn-${{ github.ref_name }}-windows-x64-Setup.exe") {
              $zipName = "FloraSubs-Reborn-${{ github.ref_name }}-windows-x64-portable.zip"
              Compress-Archive -Path "FloraSubs-Reborn-${{ github.ref_name }}-windows-x64-Setup.exe" -DestinationPath $zipName
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/FloraSubs-Reborn-${{ github.ref_name }}-windows-x64-Setup.exe
            src-tauri/target/release/bundle/FloraSubs-Reborn-${{ github.ref_name }}-windows-x64-portable.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: ./linux-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: ./windows-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "FloraSubs Reborn ${{ github.ref_name }} (Stable)"
          body: |
            ## FloraSubs Reborn ${{ github.ref_name }} - Official Multi-Platform Release
            
            - **18 AI Neural Model Catalog**: Full AnimeJaNai V3 family, Adore & Fallin (Real-CUGAN), AniScale, LD-Anime, Real-ESRGAN Video with categorized UI & downloader
            - **Windows Encoding Stability**: Clamped CPU decoder threads (<=16) to eliminate thread exhaustion halts
            - **Lanczos 2K/4K Scaling Pipeline**: High-precision resolution-aware scaling (`lanczos+accurate_rnd`) rendering subtitles crystal clear at native 1440p/2160p
            - **Windows Native Installer**: Native Windows `setup.exe` installer with NSIS and portable zip
            - **Linux Packages**: DEB, AppImage, and portable tarball
            - **Hardware Acceleration**: AMD AMF, NVIDIA NVENC, Intel QSV, Linux VAAPI
            - **FFmpeg 7.x**: Bundled static builds with libass, AMF, NVENC, QSV support
            - **Windows**: `FloraSubs-Reborn-${{ github.ref_name }}-windows-x64-Setup.exe` (NSIS Installer)
            - **Windows Portable**: `FloraSubs-Reborn-${{ github.ref_name }}-windows-x64-portable.zip`
            - **Linux DEB**: `FloraSubs-Reborn-${{ github.ref_name }}-linux-x86_64.deb`
            - **Linux AppImage**: `FloraSubs-Reborn-${{ github.ref_name }}-linux-x86_64.AppImage`
            - **Linux Tarball**: `FloraSubs-Reborn-${{ github.ref_name }}-linux-x86_64.tar.gz`
          draft: false
          prerelease: false
          files: |
            ./linux-artifacts/**/*.deb
            ./linux-artifacts/**/*.AppImage
            ./linux-artifacts/**/*.tar.gz
            ./linux-artifacts/*.deb
            ./linux-artifacts/*.AppImage
            ./linux-artifacts/*.tar.gz
            ./windows-artifacts/**/*.exe
            ./windows-artifacts/**/*.zip
            ./windows-artifacts/*.exe
            ./windows-artifacts/*.zip