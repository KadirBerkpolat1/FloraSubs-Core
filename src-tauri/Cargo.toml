[package]
name = "florasubs-core"
version = "1.3.0"
description = "High Performance Fansub & Anime Video Encoding Station"
authors = ["Jony & Berk"]
edition = "2021"

[lib]
name = "florasubs_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
which = "6.0"
sysinfo = "0.32"
tempfile = "3.13"
uuid = { version = "1.10", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
dirs = "6.0"
open = "5.4"
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
